name: Build Android APK

on:
  workflow_dispatch:
    inputs:
      app_name:        { description: 'App Name',          required: true,  default: 'MyApp' }
      app_url:         { description: 'Website URL',        required: true,  default: 'https://example.com' }
      package_id:      { description: 'Package ID',         required: true,  default: 'com.app5web.myapp' }
      app_version:     { description: 'Version Name',       required: true,  default: '1.0.0' }
      version_code:    { description: 'Version Code',       required: false, default: '1' }
      color_primary:   { description: 'Primary hex (no #)', required: false, default: '3b82f6' }
      color_accent:    { description: 'Accent hex (no #)',  required: false, default: '8b5cf6' }
      color_bg:        { description: 'BG hex (no #)',      required: false, default: 'ffffff' }
      splash_text:     { description: 'Splash Text',        required: false, default: 'Loading...' }
      splash_duration: { description: 'Splash ms',          required: false, default: '2000' }
      enable_js:       { description: 'Enable JS',          required: false, default: 'true' }
      enable_zoom:     { description: 'Enable Zoom',        required: false, default: 'true' }
      enable_offline:  { description: 'Offline Cache',      required: false, default: 'false' }
      enable_geo:      { description: 'Geolocation',        required: false, default: 'false' }
      enable_camera:   { description: 'Camera',             required: false, default: 'false' }
      permissions:     { description: 'Permissions (CSV)',  required: false, default: 'INTERNET' }
      min_sdk:         { description: 'Min SDK',            required: false, default: '23' }
      target_sdk:      { description: 'Target SDK',         required: false, default: '33' }
      orientation:     { description: 'Orientation',        required: false, default: 'unspecified' }

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: true

      - name: Install SDK platforms
        run: |
          sdkmanager "platforms;android-${{ inputs.target_sdk }}" "build-tools;33.0.2" || true

      - name: Generate project
        env:
          APP_NAME:       ${{ inputs.app_name }}
          APP_URL:        ${{ inputs.app_url }}
          PKG_ID:         ${{ inputs.package_id }}
          APP_VERSION:    ${{ inputs.app_version }}
          VERSION_CODE:   ${{ inputs.version_code }}
          COLOR_PRIMARY:  ${{ inputs.color_primary }}
          COLOR_ACCENT:   ${{ inputs.color_accent }}
          COLOR_BG:       ${{ inputs.color_bg }}
          SPLASH_TEXT:    ${{ inputs.splash_text }}
          SPLASH_MS:      ${{ inputs.splash_duration }}
          ENABLE_JS:      ${{ inputs.enable_js }}
          ENABLE_ZOOM:    ${{ inputs.enable_zoom }}
          ENABLE_OFFLINE: ${{ inputs.enable_offline }}
          ENABLE_GEO:     ${{ inputs.enable_geo }}
          ENABLE_CAMERA:  ${{ inputs.enable_camera }}
          PERMISSIONS:    ${{ inputs.permissions }}
          MIN_SDK:        ${{ inputs.min_sdk }}
          TARGET_SDK:     ${{ inputs.target_sdk }}
          ORIENTATION:    ${{ inputs.orientation }}
        run: python3 generate_project.py

      - name: Ensure gradlew executable & wrapper jar
        run: |
          chmod +x generated/gradlew
          JAR="generated/gradle/wrapper/gradle-wrapper.jar"
          if [ ! -s "$JAR" ]; then
            echo "Downloading gradle-wrapper.jar..."
            curl -fsSL -o "$JAR" \
              "https://github.com/gradle/gradle/raw/v8.2.0/gradle/wrapper/gradle-wrapper.jar" \
              || wget -qO "$JAR" \
              "https://github.com/gradle/gradle/raw/v8.2.0/gradle/wrapper/gradle-wrapper.jar"
          fi

      - name: Build APK
        working-directory: generated
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Locate & rename APK
        id: apk
        run: |
          APK=$(find generated -name "*.apk" | head -1)
          SAFE=$(echo "${{ inputs.app_name }}" | sed 's/[^a-zA-Z0-9_-]/_/g')
          DEST="${SAFE}_v${{ inputs.app_version }}.apk"
          cp "$APK" "$DEST"
          echo "path=$DEST" >> $GITHUB_OUTPUT
          echo "name=$DEST" >> $GITHUB_OUTPUT
          ls -lh "$DEST"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.app_name }}_v${{ inputs.app_version }}
          path: ${{ steps.apk.outputs.path }}
          retention-days: 30

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v${{ inputs.app_version }}-${{ github.run_number }}"
          name: "${{ inputs.app_name }} v${{ inputs.app_version }}"
          body: |
            ### ${{ inputs.app_name }}
            | | |
            |---|---|
            | **URL** | ${{ inputs.app_url }} |
            | **Package** | ${{ inputs.package_id }} |
            | **Version** | ${{ inputs.app_version }} |
            | **Min Android** | API ${{ inputs.min_sdk }} |

            **Cara install:**
            1. Download file `.apk` di bawah
            2. Settings → Security → Install unknown apps → Allow
            3. Tap file APK → Install
          files: ${{ steps.apk.outputs.path }}
          token: ${{ secrets.GITHUB_TOKEN }}
          make_latest: true
